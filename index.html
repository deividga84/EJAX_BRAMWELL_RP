<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EJAX BRAMWELL RP — Servidor Oficial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ── RESET ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gold:    #D4A017;
  --gold-lt: #F0C842;
  --red:     #9B1C1C;
  --red-lt:  #C0392B;
  --night:   #08080F;
  --surface: #10101C;
  --card:    #14142A;
  --border:  rgba(212,160,23,.18);
  --text:    #EDEDF0;
  --muted:   #6B6B8A;
  --font-d:  'Bebas Neue', sans-serif;
  --font-b:  'Outfit', sans-serif;
  --font-m:  'Space Mono', monospace;
}
html { scroll-behavior: smooth; }
body {
  background: var(--night);
  color: var(--text);
  font-family: var(--font-b);
  overflow-x: hidden;
  line-height: 1.6;
}
::selection { background: var(--gold); color: #000; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--night); }
::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

/* ── CANVAS ── */
#city-canvas {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  opacity: .3;
}

/* ── NAV ── */
nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 60px;
  background: linear-gradient(to bottom, rgba(8,8,15,.96) 0%, transparent 100%);
  transition: background .3s, border-color .3s;
  border-bottom: 1px solid transparent;
}
nav.scrolled {
  background: rgba(8,8,15,.97);
  border-bottom-color: var(--border);
}
.nav-logo {
  font-family: var(--font-d);
  font-size: 1.5rem;
  letter-spacing: .12em;
  color: var(--gold);
  text-decoration: none;
  display: flex; align-items: center; gap: 10px;
}
.nav-logo .logo-plain { color: var(--text); }
.nav-badge {
  font-family: var(--font-m);
  font-size: .55rem;
  background: var(--red);
  color: #fff;
  padding: 3px 8px;
  border-radius: 2px;
  letter-spacing: .1em;
}
.nav-links { display: flex; gap: 36px; list-style: none; }
.nav-links a {
  color: var(--muted); text-decoration: none;
  font-size: .82rem; font-weight: 500;
  letter-spacing: .06em; text-transform: uppercase;
  transition: color .2s;
}
.nav-links a:hover { color: var(--gold); }
.nav-cta {
  background: var(--gold); color: #000;
  font-family: var(--font-b); font-weight: 700;
  font-size: .78rem; letter-spacing: .08em;
  text-transform: uppercase; padding: 10px 22px;
  border-radius: 3px; text-decoration: none;
  transition: background .2s, transform .15s;
}
.nav-cta:hover { background: var(--gold-lt); transform: translateY(-1px); }

/* ════════════════════════════════
   ── HERO (REWRITTEN) ──
════════════════════════════════ */
#hero {
  position: relative;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  z-index: 1;
  padding: 120px 24px 180px;  /* top clears nav, bottom clears stats bar */
  overflow: hidden;
}

/* Grid background — contained inside hero */
.hero-grid {
  position: absolute; inset: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(212,160,23,.045) 1px, transparent 1px),
    linear-gradient(90deg, rgba(212,160,23,.045) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* Radial vignette so grid fades at edges */
.hero-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse 80% 80% at 50% 50%,
    transparent 30%, var(--night) 100%);
}

/* Scan line — full-hero, separate element, no glitchy pseudo collision */
.hero-scanline {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent 0%, var(--gold) 40%, var(--gold-lt) 50%, var(--gold) 60%, transparent 100%);
  opacity: 0;
  animation: scanline-move 5s ease-in-out infinite 1.5s;
  pointer-events: none;
  z-index: 2;
}
@keyframes scanline-move {
  0%   { top: 0%;   opacity: 0; }
  3%   { opacity: .6; }
  97%  { opacity: .6; }
  100% { top: 100%; opacity: 0; }
}

/* Hero content wrapper — sits above overlays */
.hero-content { position: relative; z-index: 3; }

/* Eyebrow */
.hero-eyebrow {
  font-family: var(--font-m);
  font-size: .68rem;
  letter-spacing: .32em;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 28px;
  opacity: 0;
  animation: fade-up .6s .4s ease-out forwards;
}

/* ── GLITCH TITLE (cleaned up) ── */
/* 
   Key fix: glitch pseudo-elements now live on a PLAIN element, 
   no nested children to collide with. Color is set directly on 
   the span, not via a child .accent class.
*/
.hero-title {
  font-family: var(--font-d);
  font-size: clamp(4.5rem, 13vw, 11rem);
  line-height: .88;
  letter-spacing: .04em;
  margin-bottom: 8px;
  opacity: 0;
  animation: fade-up .6s .6s ease-out forwards;
}

/* EJAX — glitch word (no children) */
.gword {
  display: block;
  color: var(--gold);
  position: relative;
}
.gword::before,
.gword::after {
  content: attr(data-g);
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  font-family: var(--font-d);
  font-size: inherit;
  letter-spacing: inherit;
  pointer-events: none;
}
.gword::before {
  color: var(--red-lt);
  clip-path: polygon(0 15%, 100% 15%, 100% 40%, 0 40%);
  animation: g-before 5s infinite 2s;
}
.gword::after {
  color: #29c7ff;
  clip-path: polygon(0 60%, 100% 60%, 100% 82%, 0 82%);
  animation: g-after 5s infinite 2s;
}
@keyframes g-before {
  0%,85%,100% { transform: none; opacity: 0; }
  86%   { transform: translate(4px, -2px);  opacity: .75; }
  88%   { transform: translate(-4px, 2px);  opacity: .75; }
  90%   { transform: translate(2px, 0);     opacity: .75; }
  92%   { opacity: 0; }
}
@keyframes g-after {
  0%,87%,100% { transform: none; opacity: 0; }
  88%   { transform: translate(-5px, 2px);  opacity: .65; }
  90%   { transform: translate(5px, -2px);  opacity: .65; }
  92%   { transform: translate(-2px, 0);    opacity: .65; }
  93%   { opacity: 0; }
}

/* BRAMWELL — plain, white */
.title-plain { display: block; color: var(--text); }

/* RP subtitle */
.hero-sub {
  font-family: var(--font-d);
  font-size: clamp(1.4rem, 3.5vw, 2.8rem);
  letter-spacing: .45em;
  color: var(--red-lt);
  margin-bottom: 32px;
  opacity: 0;
  animation: fade-up .6s .8s ease-out forwards;
}

/* Description */
.hero-desc {
  max-width: 520px;
  margin: 0 auto 48px;
  font-size: 1rem;
  color: var(--muted);
  font-weight: 300;
  line-height: 1.75;
  opacity: 0;
  animation: fade-up .6s 1s ease-out forwards;
}
.hero-desc strong { color: var(--text); font-weight: 600; }

/* CTA buttons */
.hero-btns {
  display: flex; gap: 14px; justify-content: center; flex-wrap: wrap;
  opacity: 0;
  animation: fade-up .6s 1.2s ease-out forwards;
  margin-bottom: 0;
}

/* ── Stats bar — in-flow at bottom of hero ── */
.hero-stats-wrap {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  display: flex; justify-content: center;
  padding: 0 24px 0;
  z-index: 3;
  opacity: 0;
  animation: fade-up .6s 1.4s ease-out forwards;
}
.hero-stats {
  display: flex;
  background: rgba(14,14,28,.9);
  border: 1px solid var(--border);
  border-bottom: none;
  border-radius: 8px 8px 0 0;
  overflow: hidden;
  backdrop-filter: blur(16px);
  width: 100%;
  max-width: 640px;
}
.stat-item {
  flex: 1;
  padding: 18px 20px;
  text-align: center;
  position: relative;
}
.stat-item + .stat-item::before {
  content: ''; position: absolute;
  left: 0; top: 20%; bottom: 20%;
  width: 1px; background: var(--border);
}
.stat-num {
  font-family: var(--font-d);
  font-size: 1.9rem;
  color: var(--gold);
  letter-spacing: .05em;
  display: block;
  line-height: 1;
  margin-bottom: 4px;
}
.stat-label {
  font-family: var(--font-m);
  font-size: .56rem;
  color: var(--muted);
  letter-spacing: .16em;
  text-transform: uppercase;
}

/* ── SHARED BUTTONS ── */
.btn-primary {
  display: inline-flex; align-items: center; gap: 12px;
  background: var(--gold); color: #000;
  font-family: var(--font-b); font-weight: 700;
  font-size: .95rem; letter-spacing: .06em;
  text-transform: uppercase; padding: 16px 38px;
  border-radius: 4px; text-decoration: none;
  position: relative; overflow: hidden;
  border: none; cursor: pointer;
  transition: transform .2s, box-shadow .2s;
}
.btn-primary::after {
  content: '';
  position: absolute; top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
  transition: left .5s;
}
.btn-primary:hover::after { left: 100%; }
.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 14px 40px rgba(212,160,23,.45);
}

.btn-ghost {
  display: inline-flex; align-items: center; gap: 10px;
  border: 1px solid var(--border); color: var(--muted);
  font-size: .88rem; font-weight: 500;
  padding: 16px 30px; border-radius: 4px;
  text-decoration: none; letter-spacing: .04em;
  transition: border-color .2s, color .2s;
}
.btn-ghost:hover { border-color: var(--gold); color: var(--gold); }

/* ── ANIMATIONS ── */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(28px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal {
  opacity: 0; transform: translateY(28px);
  transition: opacity .7s ease, transform .7s ease;
}
.reveal.visible { opacity: 1; transform: none; }

/* ── DOWNLOAD SECTION ── */
#download {
  position: relative; z-index: 1;
  padding: 120px 60px;
}
.section-label {
  font-family: var(--font-m);
  font-size: .62rem; letter-spacing: .3em;
  color: var(--gold); text-transform: uppercase;
  margin-bottom: 14px;
}
.section-title {
  font-family: var(--font-d);
  font-size: clamp(2.4rem, 5vw, 4.2rem);
  letter-spacing: .04em; line-height: 1;
  margin-bottom: 14px;
}
.section-sub {
  color: var(--muted); font-size: .92rem;
  max-width: 460px; margin-bottom: 56px;
}

.download-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px; padding: 48px;
  max-width: 780px; position: relative; overflow: hidden;
}
.download-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--red), var(--gold), var(--gold-lt), var(--gold), var(--red));
  background-size: 300% 100%;
  animation: shimmer 3s linear infinite;
}
@keyframes shimmer {
  0% { background-position: 0% 0; }
  100% { background-position: 300% 0; }
}
.download-meta {
  display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 36px;
}
.meta-pill {
  display: flex; align-items: center; gap: 8px;
  background: rgba(212,160,23,.07);
  border: 1px solid var(--border);
  border-radius: 4px; padding: 8px 14px;
}
.meta-pill-icon { font-size: .95rem; }
.meta-pill-text { font-family: var(--font-m); font-size: .67rem; color: var(--muted); }
.meta-pill-text strong { color: var(--gold); display: block; }

.download-inner {
  display: flex; align-items: flex-start; gap: 28px; flex-wrap: wrap;
}
.apk-icon {
  width: 76px; height: 76px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--red) 0%, var(--red-lt) 100%);
  border-radius: 18px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 12px 40px rgba(155,28,28,.4);
}
.apk-icon svg { width: 38px; height: 38px; }
.download-info { flex: 1; min-width: 220px; }
.download-info h3 {
  font-family: var(--font-d);
  font-size: 1.7rem; letter-spacing: .06em; margin-bottom: 6px;
}
.download-info p { color: var(--muted); font-size: .84rem; margin-bottom: 18px; }

.dl-counter {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-m); font-size: .67rem;
  color: var(--muted); margin-bottom: 12px;
}
.dl-dot {
  width: 7px; height: 7px; background: var(--gold);
  border-radius: 50%;
  box-shadow: 0 0 6px var(--gold);
  animation: blink 1.4s ease-in-out infinite;
}
@keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: .15; } }

.progress-bar-wrap {
  height: 3px; background: rgba(255,255,255,.06);
  border-radius: 2px; overflow: hidden;
  width: 100%; max-width: 300px; margin-bottom: 24px;
}
.progress-bar {
  height: 100%; width: 0%;
  background: linear-gradient(90deg, var(--gold), var(--gold-lt));
  border-radius: 2px;
  transition: width 1.6s cubic-bezier(.4,0,.2,1);
}
.download-card-watermark {
  position: absolute; right: -8px; bottom: -24px;
  font-family: var(--font-d); font-size: 9rem;
  color: rgba(212,160,23,.04); pointer-events: none;
  white-space: nowrap; letter-spacing: -.02em; user-select: none;
}

/* ── STEPS ── */
#como-entrar {
  position: relative; z-index: 1;
  padding: 0 60px 120px;
}
.steps-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 2px; margin-top: 56px;
  background: var(--border); border-radius: 10px; overflow: hidden;
}
.step-card {
  background: var(--card); padding: 40px 30px;
  position: relative; transition: background .25s;
}
.step-card:hover { background: #191932; }
.step-num {
  font-family: var(--font-d); font-size: 5rem;
  color: rgba(212,160,23,.1); line-height: 1;
  margin-bottom: 12px; letter-spacing: -.02em;
  transition: color .25s;
}
.step-card:hover .step-num { color: rgba(212,160,23,.2); }
.step-icon { font-size: 1.5rem; display: block; margin-bottom: 14px; }
.step-title {
  font-family: var(--font-d); font-size: 1.25rem;
  letter-spacing: .06em; margin-bottom: 10px;
}
.step-desc { font-size: .84rem; color: var(--muted); line-height: 1.65; }
code { color: var(--gold); font-size: .8rem; }
.step-badge {
  position: absolute; top: 18px; right: 18px;
  font-family: var(--font-m); font-size: .55rem;
  color: var(--gold); border: 1px solid var(--border);
  padding: 3px 8px; border-radius: 2px; letter-spacing: .1em;
}

/* ── FEATURES ── */
#features {
  position: relative; z-index: 1;
  padding: 0 60px 120px;
}
.features-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 18px; margin-top: 56px;
}
.feat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 34px 30px;
  position: relative; overflow: hidden;
  transition: transform .25s, border-color .25s, box-shadow .25s;
}
.feat-card::after {
  content: '';
  position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  opacity: 0; transition: opacity .3s;
}
.feat-card:hover { transform: translateY(-4px); border-color: rgba(212,160,23,.3); box-shadow: 0 20px 50px rgba(0,0,0,.4); }
.feat-card:hover::after { opacity: 1; }
.feat-icon {
  width: 50px; height: 50px; border-radius: 10px;
  background: rgba(212,160,23,.08);
  border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.3rem; margin-bottom: 20px;
  transition: background .25s;
}
.feat-card:hover .feat-icon { background: rgba(212,160,23,.16); }
.feat-title {
  font-family: var(--font-d); font-size: 1.2rem;
  letter-spacing: .06em; margin-bottom: 10px;
}
.feat-desc { font-size: .83rem; color: var(--muted); line-height: 1.65; }

/* ── PROMO ── */
.promo {
  position: relative; z-index: 1;
  margin: 0 60px 120px;
  border-radius: 14px; overflow: hidden;
  background: linear-gradient(135deg, #0c0c22 0%, #1a0808 60%, #0c0c22 100%);
  border: 1px solid rgba(155,28,28,.35);
  padding: 90px 60px; text-align: center;
}
.promo::before {
  content: ''; position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 70% 80% at 15% 50%, rgba(155,28,28,.18), transparent),
    radial-gradient(ellipse 70% 80% at 85% 50%, rgba(212,160,23,.1), transparent);
}
.promo > * { position: relative; }
.promo h2 {
  font-family: var(--font-d);
  font-size: clamp(2.4rem, 6vw, 5.5rem);
  letter-spacing: .06em; margin-bottom: 16px;
}
.promo p {
  color: var(--muted); font-size: .98rem;
  margin: 0 auto 40px; max-width: 460px;
}

/* ── FOOTER ── */
footer {
  position: relative; z-index: 1;
  border-top: 1px solid var(--border);
  padding: 60px 60px 40px;
}
.footer-top {
  display: flex; align-items: flex-start;
  justify-content: space-between; flex-wrap: wrap; gap: 40px;
  margin-bottom: 48px;
}
.footer-brand h3 {
  font-family: var(--font-d); font-size: 1.5rem;
  letter-spacing: .1em; color: var(--gold); margin-bottom: 10px;
}
.footer-brand p { font-size: .82rem; color: var(--muted); max-width: 240px; line-height: 1.65; }
.footer-links { display: flex; gap: 56px; flex-wrap: wrap; }
.footer-col h4 {
  font-family: var(--font-m); font-size: .62rem;
  letter-spacing: .2em; color: var(--gold);
  text-transform: uppercase; margin-bottom: 18px;
}
.footer-col ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }
.footer-col a { color: var(--muted); text-decoration: none; font-size: .82rem; transition: color .2s; }
.footer-col a:hover { color: var(--text); }
.footer-bottom {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 14px;
  padding-top: 28px; border-top: 1px solid var(--border);
}
.footer-copy { font-family: var(--font-m); font-size: .6rem; color: var(--muted); letter-spacing: .1em; }
.status-badge {
  display: flex; align-items: center; gap: 8px;
  font-family: var(--font-m); font-size: .6rem;
  color: #4ade80; letter-spacing: .1em;
}
.status-dot {
  width: 7px; height: 7px; background: #4ade80; border-radius: 50%;
  box-shadow: 0 0 8px rgba(74,222,128,.7);
  animation: blink 2s ease-in-out infinite;
}

/* ── RESPONSIVE ── */
@media (max-width: 768px) {
  nav { padding: 15px 20px; }
  .nav-links, .nav-cta { display: none; }
  #hero { padding: 100px 20px 140px; }
  #download, #como-entrar, #features { padding-left: 20px; padding-right: 20px; }
  .promo { margin: 0 20px 80px; padding: 50px 24px; }
  footer { padding: 40px 20px 30px; }
  .footer-top { flex-direction: column; }
  .download-inner { flex-direction: column; }
  .progress-bar-wrap { max-width: 100%; }
}
</style>
</head>
<body>

<canvas id="city-canvas"></canvas>

<!-- NAV -->
<nav id="navbar">
  <a href="#" class="nav-logo">
    EJAX <span class="logo-plain">BRAMWELL</span>
    <span class="nav-badge">RP</span>
  </a>
  <ul class="nav-links">
    <li><a href="#download">Download</a></li>
    <li><a href="#como-entrar">Como Entrar</a></li>
    <li><a href="#features">Recursos</a></li>
  </ul>
  <a href="#download" class="nav-cta">Baixar Launcher</a>
</nav>

<!-- HERO -->
<section id="hero">
  <!-- Background layers -->
  <div class="hero-grid"></div>
  <div class="hero-vignette"></div>
  <div class="hero-scanline"></div>

  <!-- All content in one non-overlapping wrapper -->
  <div class="hero-content">
    <p class="hero-eyebrow">— Servidor Oficial de Roleplay —</p>

    <h1 class="hero-title">
      <!-- EJAX: glitch word, no child elements -->
      <span class="gword" data-g="EJAX">EJAX</span>
      <!-- BRAMWELL: plain, no pseudo-elements touching it -->
      <span class="title-plain">BRAMWELL</span>
    </h1>

    <p class="hero-sub">ROLEPLAY</p>

    <p class="hero-desc">
      Mergulhe em um universo de <strong>roleplay imersivo</strong> com economia
      real, facções rivais, sistema policial e muito mais.
      Baixe o launcher e entre agora.
    </p>

    <div class="hero-btns">
